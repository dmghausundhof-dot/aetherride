name: aetherride_mobile
description: FlowLine Flutter client — UI, Riverpod state, offline-first domain (Spec §5).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  collection: ^1.19.0
  meta: ^1.15.0
  http: ^1.2.2
  ffi: ^2.1.3
  supabase_flutter: ^2.8.0
  flutter_blue_plus: ^1.35.2
  # 0.22+ needs AGP 8.8.2 (unreliable here). 0.21 Dart API + Android SDK 11.9.0
  # (forced in android/build.gradle.kts) is enough for pmtiles:// DACH styles.
  maplibre_gl: ^0.21.0
  geolocator: ^13.0.2
  app_links: ^6.3.3
  url_launcher: ^6.3.1
  flutter_tts: ^4.2.0
  in_app_purchase: ^3.2.0
  crypto: ^3.0.6
  archive: ^4.0.2
  sensors_plus: ^6.1.1
  image_picker: ^1.1.2
  image: ^4.5.0
  video_player: ^2.10.0
  dsp_core:
    path: packages/dsp_core
  share_plus: ^13.3.0
  file_picker: ^12.0.0-beta.7
  wakelock_plus: ^1.7.0
  permission_handler: ^11.3.1
  flutter_svg: ^2.0.17
  sentry_flutter: ^9.6.0
  three_js: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  drift_dev: ^2.22.1
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/routing/offline_graph.json
    - assets/routing/bike-overlay-sample.geojson
    - assets/seeds/naehe-peek-seeds-berlin-v1.json
    - assets/seeds/p0-dach-60min-naehe-v1.json
    - assets/seeds/p0-gaps-60min-naehe-v1.json
    - assets/seeds/p0-rhein-neckar-60min-naehe-v1.json
    - assets/seeds/p0-rhein-neckar-60min-v1.json
    - assets/seeds/p0-rhein-neckar-60min-premium-v1.json
    - assets/seeds/p0-france-60min-naehe-v1.json
    - assets/catalog/tour-geometry-overrides.json
    - assets/seeds/heroes/
    - assets/garage/
    - assets/garage/silhouettes/
    - assets/brand/
    - assets/brand/boot/
    - assets/map/pins/
    - assets/community/rider/
    - assets/tours/
    - assets/weather/
    - assets/nav/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
