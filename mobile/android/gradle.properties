org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Flutter template AGP-9 compatibility flags (remove when plugins migrate to built-in Kotlin)
android.newDsl=false
android.builtInKotlin=false
# Prefer JDK 17 for AGP (export JAVA_HOME=…/java/17… before flutter build)
# Optional machine-local override: android/gradle.properties.local (gitignored)
# org.gradle.java.home=/path/to/jdk-17
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Android 15+ / Google Play: 16 KB page-size support (AGP 8.5+ default uncompressed
# native libs). Residual risk: third-party plugin .so (MapLibre, etc.) must themselves
# be 16 KB-aligned at link time — packaging alone cannot fix misaligned ELF LOAD.
# Verify release APK/AAB with: readelf -l lib*.so | grep LOAD

