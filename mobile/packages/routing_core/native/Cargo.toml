[package]
name = "routing_core"
version = "0.2.0"
edition = "2021"
description = "AetherRide offline routing FFI (Spec §5.1 routing_core / §5.4 Valhalla)"

[lib]
crate-type = ["cdylib", "staticlib"]
name = "routing_core"

[features]
default = []
# Compile C shim + call Valhalla actor. Set VALHALLA_LIB_DIR / VALHALLA_INCLUDE_DIR
# for a real link; otherwise stub actor is used (valhalla_is_linked=0).
valhalla = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1"
